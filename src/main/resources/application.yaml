spring:
  application:
    name: glupshroom
  config:
    import: optional:application-secret.yaml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  datasource:
    url: jdbc:postgresql://localhost:5433/glupshroom
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: debug

openai:
  model: gpt-4o-mini

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    base-url: ${UPLOAD_BASE_URL:http://localhost:8080/uploads}
  repair:
    link-url: ${REPAIR_LINK_URL:https://mcm.com/repair}
  offline-mode: ${OFFLINE_MODE:false}
